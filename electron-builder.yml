directories:
  output: dist
  buildResources: build
appId: org.cmoid.silkpurse

# All native deps are N-API with working prebuilds; rebuilding breaks on
# chloride's vendored sodium-native, which tries to fetch libsodium source
# from a URL that no longer exists.
npmRebuild: false

# Without this, the stray working files in the project root (the `moid` and
# `earlbutt` run scripts, dial.js/peers.js, editor backups) are packed into
# the asar, because there is no default `files` filter.
files:
  - "**/*"
  - "!**/*~"
  # Emacs lock files are DANGLING SYMLINKS (.#name -> user@host.pid).
  # electron-builder stats every candidate, so one open buffer in the
  # project root fails the whole build with a bare ENOENT.
  - "!**/.#*"
  - "!**/#*#"
  - "!dial.js"
  - "!peers.js"
  - "!moid"
  - "!earlbutt"
  - "!docs${/*}"
  - "!scripts${/*}"

mac:
  category: public.app-category.social-networking
  # Both architectures, which was NOT possible before the embedded server
  # went away.  leveldown published no darwin-arm64 prebuild, so it was
  # compiled at install time, and node-gyp-build prefers build/Release
  # over prebuilds/ — an x64 package built from this tree shipped the
  # arm64 binary and died on launch.  Two architectures needed two
  # separate npm install trees.
  #
  # Dropping the server took leveldown with it.  Nothing compiles at
  # install time now, and every remaining native dep is prebuild-based
  # with a darwin-x64 to offer, so one tree builds both.
  #
  # Caveat on x64: it is verified only under Rosetta on Apple silicon
  # (correct binary arch, right prebuilds unpacked, crypto stack loads
  # and signs as x64), never on real Intel hardware.
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  # x64 is electron-builder's default arch, and a default arch has its
  # suffix STRIPPED — so the Intel artifacts came out as bare
  # `Silkpurse-<version>.dmg` next to an explicit `-arm64.dmg`, which on a
  # release page reads as "the normal one" rather than "the Intel one".
  # Naming the pattern explicitly is what stops the stripping (it sets
  # isUserForced); these two patterns are the defaults with that one
  # behaviour removed, so the arm64 names are unchanged.
  artifactName: ${productName}-${version}-${arch}-mac.${ext}

  # Ad-hoc signing.  See scripts/adhoc-sign.js for why an unsigned build
  # is NOT the same as an ad-hoc signed one, and why `identity: null` must
  # not be added here.
  sign: ./scripts/adhoc-sign.js

linux:
  category: Network
  target:
    - target: AppImage
      arch:
        - x64
        # - arm64
        # - armv7l
    - target: snap
      arch:
        - x64
        # - arm64
        # - armv7l
    - target: deb
      arch:
        - x64
        # - arm64
        # - armv7l
deb:
  packageCategory: net
  priority: optional
  maintainer: Daan Wynen <patchwork@muchmuch.coffee>
snap:
  publish: github

dmg:
  icon: build/dmg/icon.icns
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  target:
    - target: nsis
      arch:
        - x64
        - ia32
        # - arm64
