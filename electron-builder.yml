directories:
  output: dist
  buildResources: build
appId: org.cmoid.silkpurse

# All native deps are N-API with working prebuilds; rebuilding breaks on
# chloride's vendored sodium-native, which tries to fetch libsodium source
# from a URL that no longer exists.
npmRebuild: false

linux:
  category: Network
  target:
    - target: AppImage
      arch:
        - x64
        # - arm64
        # - armv7l
    - target: snap
      arch:
        - x64
        # - arm64
        # - armv7l
    - target: deb
      arch:
        - x64
        # - arm64
        # - armv7l
deb:
  packageCategory: net
  priority: optional
  maintainer: Daan Wynen <patchwork@muchmuch.coffee>
snap:
  publish: github

dmg:
  icon: build/dmg/icon.icns

win:
  target:
    - target: nsis
      arch:
        - x64
        - ia32
        # - arm64
